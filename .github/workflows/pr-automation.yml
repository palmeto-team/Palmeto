name: Validate and Label Pull Request

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  format-check:
    name: Check title format
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.pull_request.title;
            const format = /^\[[A-Z0-9_-]+\]:\s+\S.*$/;

            if (!format.test(title)) {
              core.setFailed(
                `PR Title Validation Failed!\n` +
                `Current title: "${title}"\n` +
                `Required format: [COMPONENT]: Description (e.g., [KERNEL]: Fix memory leak)`
              );
            }

  auto-label:
    name: Auto-label PR components
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label PR
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: ".github/labeler.yml"
          sync-labels: true
